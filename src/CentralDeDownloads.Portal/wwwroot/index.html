<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Central de Downloads</title>
  <style>
    :root{font-family:system-ui,-apple-system,sans-serif;color:#17324d;background:#f5f7fa}
    body{margin:0}header{background:#10365f;color:white;padding:1.1rem max(1rem,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between}
    header h1{font-size:1.25rem;margin:0}header button{background:none;border:1px solid #9ab2cb;color:white;padding:.4rem .8rem;border-radius:6px;cursor:pointer}
    main{max-width:1200px;margin:2rem auto;padding:0 1rem}.bar{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin:1rem 0}
    select,input,button{font:inherit;padding:.55rem;border:1px solid #bfccd8;border-radius:6px;background:white}button{cursor:pointer}
    table{border-collapse:collapse;width:100%;background:white;border-radius:10px;overflow:hidden;box-shadow:0 2px 12px #18345012}
    th,td{text-align:left;padding:.8rem;border-bottom:1px solid #e3eaf0}th{background:#eaf0f6;font-size:.85rem}td{font-size:.93rem}
    .status{font-weight:600}.pronto{color:#127344}.falhou{color:#b02b29}.processando,.na_fila{color:#9a6410}
    a{color:#165baa;text-decoration:none}a:hover{text-decoration:underline}.muted{color:#60758b}#message{min-height:1.5rem}
    dialog{border:0;border-radius:10px;box-shadow:0 12px 50px #1235;max-width:min(92vw,550px)}dialog::backdrop{background:#1236}
    dl{display:grid;grid-template-columns:140px 1fr;gap:.5rem}dt{font-weight:600}dd{margin:0;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <header><h1>Central de Downloads</h1><form method="post" action="/logout"><input type="hidden" name="__RequestVerificationToken" value="{{TOKEN}}"><button>Sair</button></form></header>
  <main>
    <h2>Arquivos gerados</h2>
    <div class="bar"><label for="status">Status</label><select id="status"><option value="">Todos</option><option>recebendo</option><option>na_fila</option><option>processando</option><option>pronto</option><option>falhou</option><option>expirou</option></select><button id="refresh">Atualizar</button><span class="muted" id="pageLabel"></span></div>
    <p id="message" role="status"></p>
    <table><thead><tr><th>Nome</th><th>Período</th><th>Formato</th><th>Status</th><th>Registros</th><th>Criado em</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table>
    <div class="bar"><button id="previous">Anterior</button><button id="next">Próxima</button></div>
  </main>
  <dialog id="details"><h2>Detalhes do arquivo</h2><dl id="detailList"></dl><button id="close">Fechar</button></dialog>
  <script>
    let page=1,lastCount=0;
    const rows=document.querySelector('#rows'), message=document.querySelector('#message');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const date=s=>s?new Date(s).toLocaleString('pt-BR'):'—';
    const period=p=>p?.inicio?`${esc(p.inicio)} a ${esc(p.fim)}`:'—';
    async function apiJson(url){
      const res=await fetch(url,{headers:{Accept:'application/json'}});
      if(res.headers.get('X-Portal-Session-Expired')==='1'||(res.redirected&&new URL(res.url).pathname==='/login')){
        window.location.replace('/login?expirada=1');
        return null;
      }
      if(!res.ok)throw new Error(`Falha HTTP ${res.status}`);
      try{return await res.json();}catch{throw new Error('Resposta inesperada do servidor. Tente novamente.');}
    }
    async function load(){
      message.textContent='Carregando...';
      try{
        const status=document.querySelector('#status').value;
        const data=await apiJson(`/api/files?page=${page}&size=30&status=${encodeURIComponent(status)}`);
        if(!data)return;
        lastCount=data.arquivos.length;
        rows.innerHTML=data.arquivos.map(f=>`<tr><td>${esc(f.nome)}</td><td>${period(f.periodo)}</td><td>${esc(f.formato)}</td><td class="status ${esc(f.status)}">${esc(f.status)}</td><td>${f.totalItens??0}</td><td>${date(f.criadoEm)}</td><td><button data-id="${esc(f.id)}">Detalhes</button> ${f.status==='pronto'?`<a href="/api/files/${encodeURIComponent(f.id)}/download">Baixar</a>`:''}</td></tr>`).join('')||'<tr><td colspan="7">Nenhum arquivo encontrado.</td></tr>';
        document.querySelector('#pageLabel').textContent=`Página ${page}`;
        message.textContent='';
      }catch(e){message.textContent=e.message;}
    }
    rows.addEventListener('click',async e=>{
      const id=e.target.dataset.id;if(!id)return;
      let f;
      try{f=await apiJson(`/api/files/${encodeURIComponent(id)}`);}catch{message.textContent='Não foi possível carregar os detalhes.';return;}
      if(!f)return;
      const fields=[['Nome',f.nome],['Formato',f.formato],...(f.formatoSolicitado&&f.formatoSolicitado!==f.formato?[['Formato solicitado',f.formatoSolicitado]]:[]),['Status',f.status],['Período',f.periodo?.inicio?`${f.periodo.inicio} a ${f.periodo.fim}`:'—'],['Lotes',f.totalLotes],['Registros',f.totalItens],['Criado em',date(f.criadoEm)],['Pronto em',date(f.prontoEm)],['Expira em',date(f.expiraEm)],['Tamanho',f.tamanhoBytes?`${(f.tamanhoBytes/1048576).toFixed(2)} MiB`:'—'],['Erro',f.erro||'—']];
      document.querySelector('#detailList').innerHTML=fields.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
      document.querySelector('#details').showModal();
    });
    document.querySelector('#close').onclick=()=>document.querySelector('#details').close();
    document.querySelector('#refresh').onclick=load;
    document.querySelector('#status').onchange=()=>{page=1;load();};
    document.querySelector('#previous').onclick=()=>{if(page>1){page--;load();}};
    document.querySelector('#next').onclick=()=>{if(lastCount===30){page++;load();}};
    load();
  </script>
</body>
</html>
